<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte à rebours — GTA VI</title>
<meta name="description" content="Compte à rebours avant la sortie de Grand Theft Auto VI, le 19 novembre 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<style>
  :root{
    --pink:#ff3d7f;
    --orange:#ff9e57;
    --cyan:#29e8e0;
    --text:#fdf3ff;
    --text-dim:#c9b3e0;
    --panel-bg:rgba(12,6,22,.55);
    --panel-border:rgba(255,255,255,.16);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:#0c0616;
    color:var(--text);
    font-family:'Space Mono', monospace;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---- Background artwork ---- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:url('assets/gta6-bg.jpg');
    background-size:cover;
    background-position:center top;
  }

  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:1;
    background:
      radial-gradient(ellipse at center, rgba(8,4,16,.15) 0%, rgba(8,4,16,.5) 100%),
      linear-gradient(180deg,
        rgba(8,4,16,.4) 0%,
        rgba(8,4,16,.3) 50%,
        rgba(8,4,16,.5) 100%);
  }

  /* ---- Content ---- */
  main{
    position:relative;
    z-index:5;
    min-height:100vh;
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:5vh 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    justify-content:center;
  }

  .title{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(2.4rem, 7.5vw, 5.4rem);
    letter-spacing:.06em;
    line-height:1;
    margin-bottom:5vh;
    background:linear-gradient(100deg, #ffd27a, #ff9e57, #ff3d7f, #ff6fa8, #ff9e57, #ffd27a);
    background-size:400% 400%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradient-flow 7s ease-in-out infinite, glow-flow 7s ease-in-out infinite;
  }

  @keyframes gradient-flow{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }

  @keyframes glow-flow{
    0%{ filter:drop-shadow(0 0 22px rgba(255,158,87,.55)); }
    50%{ filter:drop-shadow(0 0 26px rgba(255,61,127,.6)); }
    100%{ filter:drop-shadow(0 0 22px rgba(255,158,87,.55)); }
  }

  /* ---- Countdown ---- */
  .countdown{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    width:100%;
    max-width:640px;
    background:var(--panel-bg);
    border:1px solid rgba(255,158,87,.4);
    border-radius:18px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    animation:border-flow 7s ease-in-out infinite;
    overflow:hidden;
  }

  @keyframes border-flow{
    0%{
      border-color:rgba(255,158,87,.45);
      box-shadow:0 0 18px rgba(255,158,87,.18), inset 0 0 20px rgba(255,158,87,.06);
    }
    50%{
      border-color:rgba(255,61,127,.55);
      box-shadow:0 0 22px rgba(255,61,127,.25), inset 0 0 20px rgba(255,61,127,.08);
    }
    100%{
      border-color:rgba(255,158,87,.45);
      box-shadow:0 0 18px rgba(255,158,87,.18), inset 0 0 20px rgba(255,158,87,.06);
    }
  }

  .unit{
    padding:clamp(16px,3.4vw,28px) 6px;
    text-align:center;
    border-left:1px solid rgba(255,255,255,.14);
  }

  .unit:first-child{ border-left:none; }

  .unit .num{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(2.1rem, 7.5vw, 3.8rem);
    line-height:1;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(100deg, #ffd27a, #ff9e57, #ff3d7f, #ff6fa8, #ff9e57, #ffd27a);
    background-size:400% 400%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradient-flow 7s ease-in-out infinite;
  }

  .unit .label{
    margin-top:.6rem;
    font-size:clamp(.55rem,1.6vw,.72rem);
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  .done-message{
    display:none;
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(1.8rem, 5vw, 3rem);
    background:linear-gradient(100deg, #ffd27a, #ff9e57, #ff3d7f, #ff6fa8, #ff9e57, #ffd27a);
    background-size:400% 400%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradient-flow 7s ease-in-out infinite;
  }

  /* ---- CTA buttons ---- */
  .cta-wrap{
    display:flex;
    flex-direction:column;
    width:fit-content;
    max-width:100%;
    margin-top:4.5vh;
  }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:clamp(10px,2vw,18px);
  }

  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:.9em 2em;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:.78rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:999px;
    border:1.5px solid rgba(255,158,87,.55);
    background:rgba(12,6,22,.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    overflow:hidden;
    isolation:isolate;
    transition:color .35s ease, border-color .35s ease, transform .3s ease;
    animation:border-flow 7s ease-in-out infinite;
    background-image:linear-gradient(100deg, #ffd27a, #ff9e57, #ff3d7f, #ff6fa8, #ff9e57, #ffd27a), linear-gradient(rgba(12,6,22,.5), rgba(12,6,22,.5));
    background-size:400% 400%, 100% 100%;
    background-position:0% 50%, 0 0;
    background-clip:text, border-box;
    -webkit-background-clip:text, border-box;
    color:transparent;
    background-origin:border-box, border-box;
    animation:border-flow 7s ease-in-out infinite, cta-text-flow 7s ease-in-out infinite;
  }

  @keyframes cta-text-flow{
    0%{ background-position:0% 50%, 0 0; }
    50%{ background-position:100% 50%, 0 0; }
    100%{ background-position:0% 50%, 0 0; }
  }

  /* ---- Featured CTA (Extended Look) ---- */
  .cta-featured{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5em;
    width:100%;
    margin-bottom:clamp(10px,2vw,16px);
    padding:.9em 2em;
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(.95rem, 2vw, 1.2rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    text-decoration:none;
    color:#170a12;
    border-radius:999px;
    border:none;
    background-image:linear-gradient(100deg, #ffd27a, #ff9e57, #ff3d7f, #ff6fa8, #ff9e57, #ffd27a);
    background-size:400% 400%;
    overflow:hidden;
    isolation:isolate;
    animation:gradient-flow 7s ease-in-out infinite, cta-pulse 3s ease-in-out infinite;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }

  .cta-featured .play-icon{
    width:0;
    height:0;
    border-top:.42em solid transparent;
    border-bottom:.42em solid transparent;
    border-left:.62em solid #170a12;
    flex-shrink:0;
  }

  @keyframes cta-pulse{
    0%{ box-shadow:0 0 22px 2px rgba(255,158,87,.45), 0 0 0 0 rgba(255,61,127,.35); }
    50%{ box-shadow:0 0 38px 8px rgba(255,61,127,.65), 0 0 0 6px rgba(255,61,127,.08); }
    100%{ box-shadow:0 0 22px 2px rgba(255,158,87,.45), 0 0 0 0 rgba(255,61,127,.35); }
  }

  .cta-featured::after{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:40%;
    height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg);
    animation:cta-shimmer 3.2s ease-in-out infinite;
  }

  @keyframes cta-shimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  .cta-featured:hover, .cta-featured:focus-visible{
    transform:translateY(-3px) scale(1.03);
  }

  .cta-featured:active{ transform:translateY(-1px) scale(1.01); }

  .cta::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:linear-gradient(100deg, #ffd27a, #ff9e57, #ff3d7f, #ff6fa8, #ff9e57, #ffd27a);
    background-size:400% 400%;
    animation:gradient-flow 7s ease-in-out infinite;
    opacity:0;
    transform:scale(.85);
    transition:opacity .35s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
  }

  .cta:hover, .cta:focus-visible{
    color:#1a0b12;
    -webkit-text-fill-color:#1a0b12;
    background-image:none;
    -webkit-background-clip:border-box;
    background-clip:border-box;
    border-color:transparent;
    transform:translateY(-3px) scale(1.04);
  }

  .cta:hover::before, .cta:focus-visible::before{
    opacity:1;
    transform:scale(1);
  }

  .cta:active{ transform:translateY(-1px) scale(1.01); }

  @media (max-width:480px){
    .cta{ padding:.85em 1.6em; font-size:.7rem; }
  }

  @media (max-width:480px){
    .countdown{ border-radius:14px; }
    .unit{ padding:14px 2px; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="bg-overlay"></div>

  <main>
    <h1 class="title">GTA VI RELEASE COUNTDOWN</h1>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
    </div>

    <p class="done-message" id="doneMessage">C'est fini ! Bienvenue à Vice City !!! </p>

    <div class="cta-wrap">
      <a class="cta-featured" href="https://www.youtube.com/watch?v=tJbzMqJGH4k" target="_blank" rel="noopener">
        <span class="play-icon"></span>
        Extended Look
      </a>
      <div class="cta-row">
        <a class="cta" href="https://store.rockstargames.com/game/buy-gta-vi" target="_blank" rel="noopener">Preorder</a>
        <a class="cta" href="https://www.rockstargames.com/videos/rkoCtr1r" target="_blank" rel="noopener">Trailer 1</a>
        <a class="cta" href="https://www.rockstargames.com/videos/cpys7u21" target="_blank" rel="noopener">Trailer 2</a>
      </div>
    </div>
  </main>

<script>
  // Release: Thursday 19 November 2026, 06:00 France time (CET, UTC+1) = 05:00 UTC
  const target = new Date("2026-11-19T05:00:00Z").getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownEl = document.getElementById('countdown');
  const doneMessageEl = document.getElementById('doneMessage');

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const now = Date.now();
    const diff = target - now;

    if(diff <= 0){
      countdownEl.style.display = 'none';
      doneMessageEl.style.display = 'block';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  tick();
  const timer = setInterval(tick, 1000);
</script>
</body>
</html>
